<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Image Optimizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #111a3a;
            --navy-ink: #0a1026;
            --cream: #fbf4e6;
            --cream-strong: #f3e2bf;
            --accent: #ff6b4a;
            --accent-2: #ffd35a;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "DM Sans", "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 760px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 48px 24px 80px;
            line-height: 1.6;
            background:
                radial-gradient(circle at 12% 10%, rgba(255, 107, 74, 0.18), transparent 40%),
                radial-gradient(circle at 88% 12%, rgba(255, 211, 90, 0.22), transparent 45%),
                linear-gradient(135deg, #fff1d6 0%, #fde6c0 45%, #f6f1e7 100%);
            color: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: var(--cream);
            padding: 30px;
            border: 4px solid var(--navy);
            box-shadow: 14px 14px 0 var(--navy-ink);
            width: 100%;
        }
        h1 {
            margin: 0 0 12px;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 40px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
        }
        h1::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 72px;
            height: 6px;
            background: var(--accent);
        }
        p {
            margin: 0 0 20px;
            font-size: 16px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 2px solid var(--navy);
            background: var(--cream-strong);
            box-shadow: 6px 6px 0 rgba(17, 26, 58, 0.25);
        }
        .controls label {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 12px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--accent);
        }
        .drop-zone {
            border: 3px dashed var(--navy);
            padding: 42px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            margin-bottom: 18px;
            background: #fff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: 8px 8px 0 rgba(17, 26, 58, 0.25);
        }
        .drop-zone:hover {
            background: var(--cream-strong);
            transform: translate(-2px, -2px);
        }
        .drop-zone.is-dragover {
            background: var(--cream-strong);
            transform: translate(-2px, -2px);
        }
        #status {
            margin-top: 16px;
            font-weight: 700;
            padding: 8px 12px;
            border: 2px solid var(--navy);
            background: white;
            box-shadow: 6px 6px 0 rgba(17, 26, 58, 0.25);
        }
        .progress-container {
            width: 100%;
            background-color: white;
            border: 2px solid var(--navy);
            margin-top: 10px;
            display: none;
            height: 22px;
            box-shadow: 6px 6px 0 rgba(17, 26, 58, 0.25);
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--navy));
            transition: width 0.1s;
        }
        @media (max-width: 640px) {
            body { padding: 24px 16px 60px; }
            h1 {
                font-size: 32px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPUB Optimizer</h1>
        <p>Reduce EPUB size by compressing images. Works entirely in your browser.</p>
        
        <div class="controls">
            <label for="quality">Quality: <span id="quality-val">80</span>%</label>
            <input type="range" id="quality" min="10" max="100" value="80">
        </div>

        <div class="drop-zone" id="drop-zone">
            Click or drag EPUB file here
            <input type="file" id="file-input" accept=".epub" style="display: none;">
        </div>

        <div id="status">Ready</div>
        <div class="progress-container" id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const qualityInput = document.getElementById('quality');
        const qualityVal = document.getElementById('quality-val');

        qualityInput.addEventListener('input', () => {
            qualityVal.textContent = qualityInput.value;
        });

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('is-dragover');
        };

        dropZone.ondragleave = () => {
            dropZone.classList.remove('is-dragover');
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('is-dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.epub')) {
                processFile(file);
            }
        };

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) processFile(file);
        };

        async function processFile(file) {
            status.textContent = "Extracting EPUB...";
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            
            try {
                const zip = await JSZip.loadAsync(file);
                const newZip = new JSZip();
                const quality = parseInt(qualityInput.value) / 100;
                
                const fileList = Object.keys(zip.files);
                let processedCount = 0;

                // EPUB standard: mimetype must be first and uncompressed
                if (zip.file("mimetype")) {
                    newZip.file("mimetype", await zip.file("mimetype").async("string"), { compression: "STORE" });
                }

                for (const path of fileList) {
                    if (path === "mimetype") continue;

                    const entry = zip.file(path);
                    if (!entry || entry.dir) {
                        if (entry && entry.dir) newZip.folder(path);
                        continue;
                    }

                    const isImage = /\.(jpg|jpeg|png)$/i.test(path);
                    
                    if (isImage) {
                        status.textContent = `Optimizing ${path.split('/').pop()}...`;
                        const blob = await entry.async("blob");
                        const optimizedBlob = await optimizeImage(blob, quality);
                        newZip.file(path, optimizedBlob);
                    } else {
                        newZip.file(path, await entry.async("blob"));
                    }

                    processedCount++;
                    progressBar.style.width = `${(processedCount / fileList.length) * 100}%`;
                }

                status.textContent = "Packaging EPUB...";
                const content = await newZip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
                
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name.replace('.epub', ' (Optimized).epub');
                a.click();
                
                status.textContent = "Done! Download started.";
                progressBar.style.width = '100%';
            } catch (err) {
                console.error(err);
                status.textContent = "Error: " + err.message;
            }
        }

        async function optimizeImage(blob, quality) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    // Always convert to JPEG for best compression in books
                    canvas.toBlob((result) => {
                        resolve(result || blob);
                    }, 'image/jpeg', quality);
                };
                img.onerror = () => resolve(blob);
                img.src = URL.createObjectURL(blob);
            });
        }
    </script>
</body>
</html>
